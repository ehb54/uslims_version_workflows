name: UltraScan Build Matrix

on:
  workflow_call:
    inputs:
      matrix_json:
        description: JSON matrix definition for UltraScan builds
        required: true
        type: string
      artifact_name_prefix:
        description: Prefix used when uploading build artifacts
        required: false
        type: string
        default: ultrascan
      artifact_retention_days:
        description: Artifact retention days
        required: false
        type: number
        default: 7

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix_json) }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install documentation dependencies (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r doc/manual/source/requirements.txt

      - name: Install documentation dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r doc/manual/source/requirements.txt

      - name: Install Ubuntu prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            ninja-build \
            rsync \
            pkg-config \
            tar \
            gzip \
            xz-utils \
            libgl1-mesa-dev \
            libopengl-dev \
            libglu1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrender-dev \
            libxcb1-dev \
            libxcb-cursor0 \
            libxcb-glx0-dev \
            libxcb-keysyms1-dev \
            libxcb-image0-dev \
            libxcb-shm0-dev \
            libxcb-icccm4-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-util-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libdbus-1-dev \
            libssl-dev \
            libmariadb-dev \
            libarchive-dev

      - name: Select Xcode
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          if [ -d /Applications/Xcode_16.app/Contents/Developer ]; then
            sudo xcode-select --switch /Applications/Xcode_16.app/Contents/Developer
          elif [ -d /Applications/Xcode_15.app/Contents/Developer ]; then
            sudo xcode-select --switch /Applications/Xcode_15.app/Contents/Developer
          elif [ -d /Applications/Xcode.app/Contents/Developer ]; then
            sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          fi
          xcode-select -p
          xcodebuild -version
          xcrun --version

      - name: Install Windows prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install ninja nsis --no-progress -y

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ~/.vcpkg-cache
            ~/vcpkg/downloads
            ~/vcpkg/packages
            ~/vcpkg/buildtrees
            C:\Users\runneradmin\.vcpkg-cache
            C:\Users\runneradmin\vcpkg\downloads
            C:\Users\runneradmin\vcpkg\packages
            C:\Users\runneradmin\vcpkg\buildtrees
          key: ${{ runner.os }}-${{ matrix.cache_suffix }}-vcpkg-${{ hashFiles('vcpkg.json', 'buildsys/vcpkg/**', 'CMakeLists.txt', 'scripts/build.sh', 'scripts/build.bat', 'scripts/build.ps1', 'cmake/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.cache_suffix }}-vcpkg-
            ${{ runner.os }}-vcpkg-

      - name: Build
        shell: ${{ matrix.shell }}
        run: ${{ matrix.build_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name_prefix }}-${{ matrix.name }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
