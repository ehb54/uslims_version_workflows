  # ===========================================================================
  # CLEANUP
  # Runs after all platforms finish. Deletes:
  #   1. Any remaining intermediate stage keys (safety net for failed gates)
  #   2. Superseded full-build keys: same platform/variant/profile prefix but
  #      a different (older) hash. These accumulate across warm runs when the
  #      hash inputs change (e.g. a commit modifies vcpkg.json). Without this,
  #      two successive warm runs each leave a full-build key, doubling quota.
  # Requires the caller workflow to grant actions: write permission.
  # ===========================================================================

  cleanup-stage-caches:
    name: "Delete stage keys and superseded full-build keys"
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - ubuntu-stage5-qwt
      - ubuntu-hpc
      - macos-stage5-qwt
      - macos-intel-stage5-qwt
      - rocky8-stage5-qwt
      - rocky8-hpc
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Delete stage keys and superseded full-build keys
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Delete all cache entries whose keys start with a given prefix.
          delete_by_prefix() {
            local prefix="$1"
            gh cache list --repo "$REPO" --limit 100 --json key,id \
              | jq -r ".[] | select(.key | startswith(\"${prefix}\")) | .id" \
              | while read -r id; do
                  echo "  Deleting ${id}"
                  gh cache delete --repo "$REPO" "${id}" || true
                done
          }

          # Determine which cache platform labels to operate on.
          # When warming a single platform, scope cleanup to that platform only
          # so we don't stomp on stage keys for other platforms warming in parallel.
          case "${{ inputs.platforms }}" in
            "all")                          PLATFORMS="ubuntu-24.04 macos-15 macos-15-intel rocky8" ;;
            "ubuntu-x64 (ubuntu-24.04)")    PLATFORMS="ubuntu-24.04" ;;
            "macos-arm (macos-15)")         PLATFORMS="macos-15" ;;
            "macos-intel (macos-15-intel)") PLATFORMS="macos-15-intel" ;;
            "rocky8-x64")                   PLATFORMS="rocky8" ;;
            *)                              PLATFORMS="ubuntu-24.04 macos-15 macos-15-intel rocky8" ;;
          esac
          echo "Cleaning platforms: $PLATFORMS"

          # 1. Delete all remaining intermediate stage keys (gate safety net).
          echo "=== Deleting intermediate stage keys ==="
          for platform in $PLATFORMS; do
            for variant in qt6 qt5-qwt630; do
              for stage in stage1 stage2 stage3 stage4 stage5; do
                delete_by_prefix "vcpkg-${platform}-${variant}-APP-${stage}-"
              done
            done
          done

          # 2. Delete superseded full-build keys (same prefix, old hash).
          # Keeps only the entry whose key exactly matches the current hash.
          echo "=== Deleting superseded full-build keys ==="
          CURRENT_HASH="${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}"

          for platform in $PLATFORMS; do
            for variant in qt6 qt5-qwt630; do
              for profile in APP HPC; do
                prefix="vcpkg-${platform}-${variant}-${profile}-"
                current_key="${prefix}${CURRENT_HASH}"
                gh cache list --repo "$REPO" --limit 100 --json key,id \
                  | jq -r ".[] | select(.key | startswith(\"${prefix}\")) | select(.key != \"${current_key}\") | .id" \
                  | while read -r id; do
                      echo "  Deleting superseded ${id}"
                      gh cache delete --repo "$REPO" "${id}" || true
                    done
              done
            done
          done
