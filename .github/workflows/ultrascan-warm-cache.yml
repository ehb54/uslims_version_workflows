# =============================================================================
# UltraScan3 vcpkg Cache Warmer
# =============================================================================
# Installs vcpkg dependencies in staged jobs, saving the binary cache after
# each stage completes so partial progress is never lost.
#
# STAGE BREAKDOWN
# ---------------
# qt6 (4 stages):
#   1  base     openssl, zlib, libarchive, eigen3       (~5 min)
#   2  qtbase   qtbase alone                            (~25-40 min)
#   3  qtmods   Qt modules + libmariadb + sqlite3       (~15 min)
#   4  qwt      qwt-6-3-0-qt6 + qwtplot3d-qwt-6-3-0-qt6  (~10 min)
#
# qt5-qwt616 (3 stages):
#   1  base     openssl, zlib, libarchive, eigen3       (~5 min)
#   2  qt5mods  qt5-base + Qt modules + DB libs         (~20 min)
#   3  qwt      qwt-6-1-6 + qwtplot3d-qwt-6-1-6-qt5   (~10 min)
#   (stage 4 job is skipped for qt5 via if condition)
#
# Stages use dedicated warm-only features in vcpkg.json (warm-qt6-stage2,
# warm-qt6-stage3, etc.) so port subsets can be selected in manifest mode.
# These features have no effect on real builds.
#
# Stage N restores the stage N-1 cache key so vcpkg only builds what is
# new; ports already in the binary cache are restored instantly.
#
# The final stage additionally saves with the key that
# ultrascan-reusable-build.yml restores, so warmed caches are used
# transparently by full builds with no changes to that workflow.
#
# PLATFORMS
# ---------
#   ubuntu-x64 (ubuntu-24.04)  / qt6 (or qt5-qwt616)
#   macos-arm  (macos-15)      / qt6 (Apple Silicon arm64)
#
# TRIGGERS
# --------
#   workflow_call only — dispatched via warm-cache.yml in the ultrascan3 repo.
# =============================================================================

name: UltraScan3 Warm vcpkg Cache

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag, or SHA to check out"
        required: false
        type: string
        default: main

      qt_variant:
        description: "Qt variant: qt6 | qt5-qwt616"
        required: false
        type: string
        default: qt6

      platforms:
        description: "Platforms to warm: all | ubuntu-x64 (ubuntu-24.04) | macos-arm (macos-15)"
        required: false
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: warm-cache-${{ github.ref }}-${{ inputs.qt_variant }}-${{ inputs.platforms }}
  cancel-in-progress: true

jobs:

  # ===========================================================================
  # UBUNTU-24.04 x64
  # ===========================================================================

  ubuntu-stage1-base:
    name: "ubuntu-24.04 / ${{ inputs.qt_variant }} — Stage 1: base deps"
    if: inputs.platforms == 'all' || inputs.platforms == 'ubuntu-x64 (ubuntu-24.04)'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Ensure scripts are executable
        run: chmod +x scripts/warm-cache.sh scripts/bootstrap-linux.sh

      - name: Restore vcpkg cache (stage 1)
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage1-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}
          restore-keys: |
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage1-
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-

      - name: Stage 1 — base deps
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          bash scripts/warm-cache.sh --stage 1 --${{ inputs.qt_variant }}

      - name: Reclaim disk before cache save
        if: always()
        run: rm -rf "$HOME/us3-scratch/vcpkg/buildtrees" "$HOME/vcpkg/buildtrees" || true

      - name: Save vcpkg cache (stage 1)
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage1-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}

  ubuntu-stage2:
    name: "ubuntu-24.04 / ${{ inputs.qt_variant }} — Stage 2: ${{ inputs.qt_variant == 'qt6' && 'qtbase' || 'qt5 + modules' }}"
    if: inputs.platforms == 'all' || inputs.platforms == 'ubuntu-x64 (ubuntu-24.04)'
    runs-on: ubuntu-24.04
    needs: ubuntu-stage1-base
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Ensure scripts are executable
        run: chmod +x scripts/warm-cache.sh scripts/bootstrap-linux.sh

      - name: Restore vcpkg cache (through stage 1)
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage1-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}
          restore-keys: |
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage1-
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-

      - name: Stage 2
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          bash scripts/warm-cache.sh --stage 2 --${{ inputs.qt_variant }}

      - name: Reclaim disk before cache save
        if: always()
        run: rm -rf "$HOME/us3-scratch/vcpkg/buildtrees" "$HOME/vcpkg/buildtrees" || true

      - name: Save vcpkg cache (stage 2)
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage2-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}

  ubuntu-stage3:
    name: "ubuntu-24.04 / ${{ inputs.qt_variant }} — Stage 3: ${{ inputs.qt_variant == 'qt6' && 'Qt modules + DB' || 'Qwt' }}"
    if: inputs.platforms == 'all' || inputs.platforms == 'ubuntu-x64 (ubuntu-24.04)'
    runs-on: ubuntu-24.04
    needs: ubuntu-stage2
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Ensure scripts are executable
        run: chmod +x scripts/warm-cache.sh scripts/bootstrap-linux.sh

      - name: Restore vcpkg cache (through stage 2)
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage2-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}
          restore-keys: |
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage2-
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage1-
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-

      - name: Stage 3
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          bash scripts/warm-cache.sh --stage 3 --${{ inputs.qt_variant }}

      - name: Reclaim disk before cache save
        if: always()
        run: rm -rf "$HOME/us3-scratch/vcpkg/buildtrees" "$HOME/vcpkg/buildtrees" || true

      - name: Save vcpkg cache (stage 3)
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage3-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}

      # qt5 is done after stage 3 — write the full-build key now
      - name: Save vcpkg cache (full-build key, qt5 only)
        if: inputs.qt_variant != 'qt6'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}

  ubuntu-stage4-qwt:
    name: "ubuntu-24.04 / qt6 — Stage 4: Qwt"
    # Stage 4 only exists for qt6; qt5 finishes at stage 3
    if: (inputs.platforms == 'all' || inputs.platforms == 'ubuntu-x64 (ubuntu-24.04)') && inputs.qt_variant == 'qt6'
    runs-on: ubuntu-24.04
    needs: ubuntu-stage3
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Ensure scripts are executable
        run: chmod +x scripts/warm-cache.sh scripts/bootstrap-linux.sh

      - name: Restore vcpkg cache (through stage 3)
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage3-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}
          restore-keys: |
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage3-
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage2-
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-

      - name: Stage 4 — Qwt + QwtPlot3D
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          bash scripts/warm-cache.sh --stage 4 --${{ inputs.qt_variant }}

      - name: Reclaim disk before cache save
        if: always()
        run: rm -rf "$HOME/us3-scratch/vcpkg/buildtrees" "$HOME/vcpkg/buildtrees" || true

      - name: Save vcpkg cache (stage 4)
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-ubuntu-24.04-qt6-APP-stage4-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}

      - name: Save vcpkg cache (full-build key)
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-ubuntu-24.04-qt6-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}

  # ===========================================================================
  # MACOS-15 arm64
  # ===========================================================================

  macos-stage1-base:
    name: "macos-15 / ${{ inputs.qt_variant }} — Stage 1: base deps"
    if: inputs.platforms == 'all' || inputs.platforms == 'macos-arm (macos-15)'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Ensure scripts are executable
        run: chmod +x scripts/warm-cache.sh scripts/bootstrap-macos.sh

      - name: Restore vcpkg cache (stage 1)
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage1-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}
          restore-keys: |
            vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage1-
            vcpkg-macos-15-${{ inputs.qt_variant }}-APP-

      - name: Stage 1 — base deps
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          bash scripts/warm-cache.sh --stage 1 --${{ inputs.qt_variant }}

      - name: Reclaim disk before cache save
        if: always()
        run: rm -rf "$HOME/vcpkg/buildtrees" || true

      - name: Save vcpkg cache (stage 1)
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage1-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}

  macos-stage2:
    name: "macos-15 / ${{ inputs.qt_variant }} — Stage 2: ${{ inputs.qt_variant == 'qt6' && 'qtbase' || 'qt5 + modules' }}"
    if: inputs.platforms == 'all' || inputs.platforms == 'macos-arm (macos-15)'
    runs-on: macos-15
    needs: macos-stage1-base
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Ensure scripts are executable
        run: chmod +x scripts/warm-cache.sh scripts/bootstrap-macos.sh

      - name: Restore vcpkg cache (through stage 1)
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage1-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}
          restore-keys: |
            vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage1-
            vcpkg-macos-15-${{ inputs.qt_variant }}-APP-

      - name: Stage 2
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          bash scripts/warm-cache.sh --stage 2 --${{ inputs.qt_variant }}

      - name: Reclaim disk before cache save
        if: always()
        run: rm -rf "$HOME/vcpkg/buildtrees" || true

      - name: Save vcpkg cache (stage 2)
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage2-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}

  macos-stage3:
    name: "macos-15 / ${{ inputs.qt_variant }} — Stage 3: ${{ inputs.qt_variant == 'qt6' && 'Qt modules + DB' || 'Qwt' }}"
    if: inputs.platforms == 'all' || inputs.platforms == 'macos-arm (macos-15)'
    runs-on: macos-15
    needs: macos-stage2
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Ensure scripts are executable
        run: chmod +x scripts/warm-cache.sh scripts/bootstrap-macos.sh

      - name: Restore vcpkg cache (through stage 2)
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage2-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}
          restore-keys: |
            vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage2-
            vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage1-
            vcpkg-macos-15-${{ inputs.qt_variant }}-APP-

      - name: Stage 3
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          bash scripts/warm-cache.sh --stage 3 --${{ inputs.qt_variant }}

      - name: Reclaim disk before cache save
        if: always()
        run: rm -rf "$HOME/vcpkg/buildtrees" || true

      - name: Save vcpkg cache (stage 3)
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage3-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}

      - name: Save vcpkg cache (full-build key, qt5 only)
        if: inputs.qt_variant != 'qt6'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-macos-15-${{ inputs.qt_variant }}-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}

  macos-stage4-qwt:
    name: "macos-15 / qt6 — Stage 4: Qwt"
    if: (inputs.platforms == 'all' || inputs.platforms == 'macos-arm (macos-15)') && inputs.qt_variant == 'qt6'
    runs-on: macos-15
    needs: macos-stage3
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Ensure scripts are executable
        run: chmod +x scripts/warm-cache.sh scripts/bootstrap-macos.sh

      - name: Restore vcpkg cache (through stage 3)
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage3-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}
          restore-keys: |
            vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage3-
            vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage2-
            vcpkg-macos-15-${{ inputs.qt_variant }}-APP-

      - name: Stage 4 — Qwt + QwtPlot3D
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          bash scripts/warm-cache.sh --stage 4 --${{ inputs.qt_variant }}

      - name: Reclaim disk before cache save
        if: always()
        run: rm -rf "$HOME/vcpkg/buildtrees" || true

      - name: Save vcpkg cache (stage 4)
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-macos-15-qt6-APP-stage4-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}

      - name: Save vcpkg cache (full-build key)
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-macos-15-qt6-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
