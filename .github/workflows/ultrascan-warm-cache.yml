# =============================================================================
# UltraScan3 vcpkg Cache Warmer
# =============================================================================
# Installs vcpkg dependencies in staged jobs, saving the binary cache after
# each stage completes so partial progress is never lost.
#
# STAGE BREAKDOWN
# ---------------
# qt6 (5 stages):
#   1  base       openssl, zlib, libarchive, eigen3          (~5 min)
#   2  qtbase     qtbase alone                               (~25-40 min)
#   3  qtmulti    qtmultimedia + qtdeclarative               (~30-60 min)
#   4  qtmods     qtdatavis3d, qtsvg, qttools + DB libs      (~15-20 min)
#   5  qwt        qwt-6-3-0-qt6 + qwtplot3d-qwt-6-3-0-qt6  (~10 min)
#
# qt5-qwt630 (3 stages):
#   1  base     openssl, zlib, libarchive, eigen3            (~5 min)
#   2  qt5mods  qt5-base + Qt modules + DB libs              (~20 min)
#   3  qwt      qwt-6-3-0 + qwtplot3d-qwt-6-3-0-qt5        (~10 min)
#   (stages 4+5 jobs are skipped for qt5 via if condition)
#
# qtmultimedia pulls qtdeclarative as a transitive dep; it is isolated in
# stage 3 so its large buildtree does not compete with other ports for disk.
#
# Stages use dedicated warm-only features in vcpkg.json (warm-qt6-stage2,
# warm-qt6-stage3, etc.) so port subsets can be selected in manifest mode.
# These features have no effect on real builds.
#
# Stage N restores the stage N-1 cache key so vcpkg only builds what is
# new; ports already in the binary cache are restored instantly.
#
# The final stage additionally saves with the key that
# ultrascan-reusable-build.yml restores, so warmed caches are used
# transparently by full builds with no changes to that workflow.
#
# Only the binary cache (us3-vcpkg-cache) is saved — not the downloads cache.
# This halves cache entry size and keeps the repo under the 10 GB cache limit.
# vcpkg re-downloads source tarballs on a cold start; no rebuild is triggered.
#
# CACHE QUOTA MANAGEMENT
# ----------------------
# The staged design creates N intermediate cache entries during a warm run.
# With macOS at ~1 GB per stage, naive accumulation exceeds the 10 GB quota.
#
# The solution is a "gate job" between each stage: a bare ubuntu-24.04 job
# whose sole purpose is to delete the previous stage's cache key before the
# next stage saves its (larger) key. This guarantees at most 2 keys exist
# per platform at any point: the gate job deletes stageN-1 before stageN+1
# saves, so the high-water mark is stageN + stageN+1 briefly overlapping.
#
# Gate jobs always run on ubuntu-24.04 (never in a container) so gh CLI is
# always available. Rocky 8 build jobs run in rockylinux:8 containers where
# gh is absent — gate jobs handle all deletions for Rocky 8 too.
#
# The cleanup-stage-caches job runs after all platforms finish and deletes:
#   - Any remaining intermediate stage keys (safety net for failed gates)
#   - Superseded full-build keys (same platform/variant prefix, old hash)
#     to prevent two successive warm runs from each keeping a full-build key
#
# The caller workflow must grant actions: write permission for this to work.
#
# PLATFORMS
# ---------
#   ubuntu-x64    (ubuntu-24.04)   / qt6 or qt5-qwt630
#   macos-arm     (macos-15)       / qt6 or qt5-qwt630
#   macos-intel   (macos-15-intel) / qt6 or qt5-qwt630
#   rocky8-x64    (rockylinux:8)   / qt6 or qt5-qwt630
#
# TRIGGERS
# --------
#   workflow_call only — dispatched via warm-cache.yml in the ultrascan3 repo.
# =============================================================================

name: UltraScan3 Warm vcpkg Cache

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag, or SHA to check out"
        required: false
        type: string
        default: main

      qt_variant:
        description: "Qt variant: qt6 | qt5-qwt630"
        required: false
        type: string
        default: qt6

      platforms:
        description: "Platforms to warm: all | ubuntu-x64 (ubuntu-24.04) | macos-arm (macos-15) | macos-intel (macos-15-intel) | rocky8-x64"
        required: false
        type: string
        default: all

permissions:
  contents: read
  actions: write

concurrency:
  group: warm-cache-${{ github.ref }}-${{ inputs.qt_variant }}-${{ inputs.platforms }}
  cancel-in-progress: true

jobs:

  # ===========================================================================
  # UBUNTU-24.04 x64
  # ===========================================================================

  ubuntu-stage1-base:
    name: "ubuntu-24.04 / ${{ inputs.qt_variant }} — Stage 1: base deps"
    if: inputs.platforms == 'all' || inputs.platforms == 'ubuntu-x64 (ubuntu-24.04)'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Ensure scripts are executable
        run: chmod +x scripts/warm-cache.sh scripts/bootstrap-linux.sh

      - name: Restore vcpkg cache (stage 1)
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage1-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}
          restore-keys: |
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage1-
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-

      - name: Stage 1 — base deps
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          bash scripts/warm-cache.sh --stage 1 --${{ inputs.qt_variant }}

      - name: Reclaim disk before cache save
        if: always()
        run: rm -rf "$HOME/us3-scratch/vcpkg/buildtrees" "$HOME/vcpkg/buildtrees" || true

      - name: Save vcpkg cache (stage 1)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage1-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}

  ubuntu-gate1:
    name: "ubuntu-24.04 / ${{ inputs.qt_variant }} — Gate 1→2: delete stage 1"
    if: inputs.platforms == 'all' || inputs.platforms == 'ubuntu-x64 (ubuntu-24.04)'
    runs-on: ubuntu-24.04
    needs: ubuntu-stage2
    steps:
      - name: Delete stage 1 cache key
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh cache list --repo "$REPO" --limit 100 --json key,id \
            | jq -r '.[] | select(.key | startswith("vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage1-")) | .id' \
            | while read -r id; do
                gh cache delete --repo "$REPO" "$id" || true
              done

  ubuntu-stage2:
    name: "ubuntu-24.04 / ${{ inputs.qt_variant }} — Stage 2: ${{ inputs.qt_variant == 'qt6' && 'qtbase' || 'qt5 + modules' }}"
    if: inputs.platforms == 'all' || inputs.platforms == 'ubuntu-x64 (ubuntu-24.04)'
    runs-on: ubuntu-24.04
    needs: ubuntu-stage1-base
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Ensure scripts are executable
        run: chmod +x scripts/warm-cache.sh scripts/bootstrap-linux.sh

      - name: Restore vcpkg cache (through stage 1)
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage1-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}
          restore-keys: |
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage1-
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-

      - name: Stage 2
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          bash scripts/warm-cache.sh --stage 2 --${{ inputs.qt_variant }}

      - name: Reclaim disk before cache save
        if: always()
        run: rm -rf "$HOME/us3-scratch/vcpkg/buildtrees" "$HOME/vcpkg/buildtrees" || true

      - name: Save vcpkg cache (stage 2)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage2-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}

  ubuntu-gate2:
    name: "ubuntu-24.04 / ${{ inputs.qt_variant }} — Gate 2→3: delete stage 2"
    if: inputs.platforms == 'all' || inputs.platforms == 'ubuntu-x64 (ubuntu-24.04)'
    runs-on: ubuntu-24.04
    needs: ubuntu-stage3
    steps:
      - name: Delete stage 2 cache key
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh cache list --repo "$REPO" --limit 100 --json key,id \
            | jq -r '.[] | select(.key | startswith("vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage2-")) | .id' \
            | while read -r id; do
                gh cache delete --repo "$REPO" "$id" || true
              done

  ubuntu-stage3:
    name: "ubuntu-24.04 / ${{ inputs.qt_variant }} — Stage 3: ${{ inputs.qt_variant == 'qt6' && 'qtmultimedia + qtdeclarative' || 'Qwt' }}"
    if: inputs.platforms == 'all' || inputs.platforms == 'ubuntu-x64 (ubuntu-24.04)'
    runs-on: ubuntu-24.04
    needs: ubuntu-stage2
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Ensure scripts are executable
        run: chmod +x scripts/warm-cache.sh scripts/bootstrap-linux.sh

      - name: Restore vcpkg cache (through stage 2)
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage2-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}
          restore-keys: |
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage2-
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage1-
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-

      - name: Stage 3
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          bash scripts/warm-cache.sh --stage 3 --${{ inputs.qt_variant }}

      - name: Reclaim disk before cache save
        if: always()
        run: rm -rf "$HOME/us3-scratch/vcpkg/buildtrees" "$HOME/vcpkg/buildtrees" || true

      - name: Save vcpkg cache (stage 3)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage3-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}

      - name: Save vcpkg cache (full-build key, qt5 only)
        if: always() && inputs.qt_variant != 'qt6'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}

  ubuntu-gate3:
    name: "ubuntu-24.04 / qt6 — Gate 3→4: delete stage 3"
    if: (inputs.platforms == 'all' || inputs.platforms == 'ubuntu-x64 (ubuntu-24.04)') && inputs.qt_variant == 'qt6'
    runs-on: ubuntu-24.04
    needs: ubuntu-stage4-qtmods
    steps:
      - name: Delete stage 3 cache key
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh cache list --repo "$REPO" --limit 100 --json key,id \
            | jq -r '.[] | select(.key | startswith("vcpkg-ubuntu-24.04-qt6-APP-stage3-")) | .id' \
            | while read -r id; do
                gh cache delete --repo "$REPO" "$id" || true
              done

  ubuntu-stage4-qtmods:
    name: "ubuntu-24.04 / qt6 — Stage 4: Qt modules + DB"
    if: (inputs.platforms == 'all' || inputs.platforms == 'ubuntu-x64 (ubuntu-24.04)') && inputs.qt_variant == 'qt6'
    runs-on: ubuntu-24.04
    needs: ubuntu-stage3
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Ensure scripts are executable
        run: chmod +x scripts/warm-cache.sh scripts/bootstrap-linux.sh

      - name: Restore vcpkg cache (through stage 3)
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-ubuntu-24.04-qt6-APP-stage3-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}
          restore-keys: |
            vcpkg-ubuntu-24.04-qt6-APP-stage3-
            vcpkg-ubuntu-24.04-qt6-APP-stage2-
            vcpkg-ubuntu-24.04-qt6-APP-

      - name: Stage 4 — Qt modules + DB libs
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          bash scripts/warm-cache.sh --stage 4 --${{ inputs.qt_variant }}

      - name: Reclaim disk before cache save
        if: always()
        run: rm -rf "$HOME/us3-scratch/vcpkg/buildtrees" "$HOME/vcpkg/buildtrees" || true

      - name: Save vcpkg cache (stage 4)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-ubuntu-24.04-qt6-APP-stage4-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}

  ubuntu-gate4:
    name: "ubuntu-24.04 / qt6 — Gate 4→5: delete stage 4"
    if: (inputs.platforms == 'all' || inputs.platforms == 'ubuntu-x64 (ubuntu-24.04)') && inputs.qt_variant == 'qt6'
    runs-on: ubuntu-24.04
    needs: ubuntu-stage5-qwt
    steps:
      - name: Delete stage 4 cache key
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh cache list --repo "$REPO" --limit 100 --json key,id \
            | jq -r '.[] | select(.key | startswith("vcpkg-ubuntu-24.04-qt6-APP-stage4-")) | .id' \
            | while read -r id; do
                gh cache delete --repo "$REPO" "$id" || true
              done

  ubuntu-stage5-qwt:
    name: "ubuntu-24.04 / qt6 — Stage 5: Qwt"
    if: (inputs.platforms == 'all' || inputs.platforms == 'ubuntu-x64 (ubuntu-24.04)') && inputs.qt_variant == 'qt6'
    runs-on: ubuntu-24.04
    needs: ubuntu-stage4-qtmods
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Ensure scripts are executable
        run: chmod +x scripts/warm-cache.sh scripts/bootstrap-linux.sh

      - name: Restore vcpkg cache (through stage 4)
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-ubuntu-24.04-qt6-APP-stage4-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}
          restore-keys: |
            vcpkg-ubuntu-24.04-qt6-APP-stage4-
            vcpkg-ubuntu-24.04-qt6-APP-stage3-
            vcpkg-ubuntu-24.04-qt6-APP-

      - name: Stage 5 — Qwt + QwtPlot3D
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          bash scripts/warm-cache.sh --stage 5 --${{ inputs.qt_variant }}

      - name: Reclaim disk before cache save
        if: always()
        run: rm -rf "$HOME/us3-scratch/vcpkg/buildtrees" "$HOME/vcpkg/buildtrees" || true

      - name: Save vcpkg cache (stage 5)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-ubuntu-24.04-qt6-APP-stage5-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}

      - name: Save vcpkg cache (full-build key)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-ubuntu-24.04-qt6-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}

  ubuntu-hpc:
    name: "ubuntu-24.04 / qt6 — HPC: qtbase (minimal + zstd)"
    if: (inputs.platforms == 'all' || inputs.platforms == 'ubuntu-x64 (ubuntu-24.04)') && inputs.qt_variant == 'qt6'
    runs-on: ubuntu-24.04
    needs: ubuntu-stage1-base
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Ensure scripts are executable
        run: chmod +x scripts/warm-cache.sh scripts/bootstrap-linux.sh

      - name: Restore vcpkg cache (through stage 1)
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage1-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}
          restore-keys: |
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage1-
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-

      - name: HPC stage — qtbase with zstd
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          bash scripts/warm-cache.sh --stage hpc --qt6

      - name: Reclaim disk before cache save
        if: always()
        run: rm -rf "$HOME/us3-scratch/vcpkg/buildtrees" "$HOME/vcpkg/buildtrees" || true

      - name: Save vcpkg cache (HPC full-build key)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-ubuntu-24.04-qt6-HPC-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}

  # ===========================================================================
  # MACOS-15 arm64
  # Gate jobs run on ubuntu-24.04 — BSD xargs on macOS lacks -r flag.
  # ===========================================================================

  macos-stage1-base:
    name: "macos-15 / ${{ inputs.qt_variant }} — Stage 1: base deps"
    if: inputs.platforms == 'all' || inputs.platforms == 'macos-arm (macos-15)'
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Ensure scripts are executable
        run: chmod +x scripts/warm-cache.sh scripts/bootstrap-macos.sh

      - name: Restore vcpkg cache (stage 1)
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage1-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}
          restore-keys: |
            vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage1-
            vcpkg-macos-15-${{ inputs.qt_variant }}-APP-

      - name: Stage 1 — base deps
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          bash scripts/warm-cache.sh --stage 1 --${{ inputs.qt_variant }}

      - name: Reclaim disk before cache save
        if: always()
        run: rm -rf "$HOME/vcpkg/buildtrees" || true

      - name: Save vcpkg cache (stage 1)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage1-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}

  macos-gate1:
    name: "macos-15 / ${{ inputs.qt_variant }} — Gate 1→2: delete stage 1"
    if: inputs.platforms == 'all' || inputs.platforms == 'macos-arm (macos-15)'
    runs-on: ubuntu-24.04
    needs: macos-stage2
    steps:
      - name: Delete stage 1 cache key
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh cache list --repo "$REPO" --limit 100 --json key,id \
            | jq -r '.[] | select(.key | startswith("vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage1-")) | .id' \
            | while read -r id; do
                gh cache delete --repo "$REPO" "$id" || true
              done

  macos-stage2:
    name: "macos-15 / ${{ inputs.qt_variant }} — Stage 2: ${{ inputs.qt_variant == 'qt6' && 'qtbase' || 'qt5 + modules' }}"
    if: inputs.platforms == 'all' || inputs.platforms == 'macos-arm (macos-15)'
    runs-on: macos-15
    needs: macos-stage1-base
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Ensure scripts are executable
        run: chmod +x scripts/warm-cache.sh scripts/bootstrap-macos.sh

      - name: Restore vcpkg cache (through stage 1)
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage1-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}
          restore-keys: |
            vcpkg-macos-15-${{ inputs.qt_variant }}-APP-stage1-
            vcpkg-macos-15-${{ inputs.qt_variant }}-APP-

      - name: Stage 2
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
