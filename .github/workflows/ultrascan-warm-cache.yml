            vcpkg-rocky8-${{ inputs.qt_variant }}-APP-

      - name: Stage 3
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          bash scripts/warm-cache.sh --stage 3 --${{ inputs.qt_variant }}

      - name: Reclaim disk before cache save
        if: always()
        run: rm -rf "$HOME/us3-scratch/vcpkg/buildtrees" "$HOME/vcpkg/buildtrees" || true

      - name: Save vcpkg cache (stage 3)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-rocky8-${{ inputs.qt_variant }}-APP-stage3-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}

      - name: Delete previous stage cache (stage 2)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh cache list --repo "$REPO" --limit 100 --json key,id \
            | jq -r '.[] | select(.key | startswith("vcpkg-rocky8-${{ inputs.qt_variant }}-APP-stage2-")) | .id' \
            | xargs -r -I{} gh cache delete --repo "$REPO" {} || true

      - name: Save vcpkg cache (full-build key, qt5 only)
        if: always() && inputs.qt_variant != 'qt6'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-rocky8-${{ inputs.qt_variant }}-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}

      - name: Delete stage 3 cache (qt5 final)
        if: always() && inputs.qt_variant != 'qt6'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh cache list --repo "$REPO" --limit 100 --json key,id \
            | jq -r '.[] | select(.key | startswith("vcpkg-rocky8-${{ inputs.qt_variant }}-APP-stage3-")) | .id' \
            | xargs -r -I{} gh cache delete --repo "$REPO" {} || true

