          key: vcpkg-rocky8-qt6-HPC-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}

  # ===========================================================================
  # CLEANUP
  # Deletes intermediate stage keys (stage1-stage5) after all platforms finish,
  # keeping only the full-build keys. This prevents the repo from hitting the
  # 10 GB cache limit and having entries evicted.
  # Runs even if some platform jobs failed (so partial stage keys are cleaned up).
  # Requires the caller workflow to grant actions: write permission.
  # ===========================================================================

  cleanup-stage-caches:
    name: "Delete intermediate stage cache keys"
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - ubuntu-stage5-qwt
      - ubuntu-hpc
      - macos-stage5-qwt
      - macos-intel-stage5-qwt
      - rocky8-stage5-qwt
      - rocky8-hpc
    steps:
      - name: Delete intermediate stage cache keys
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          delete_caches_with_prefix() {
            local prefix="$1"
            echo "Deleting caches matching prefix: ${prefix}"
            gh cache list --repo "$REPO" --limit 100 --json key,id \
              | jq -r ".[] | select(.key | startswith(\"${prefix}\")) | .id" \
              | while read -r id; do
                  echo "  Deleting cache id: ${id}"
                  gh cache delete --repo "$REPO" "${id}" || true
                done
          }

          # Delete all stage1-stage5 intermediate keys for all platforms and variants
          for platform in ubuntu-24.04 macos-15 macos-15-intel rocky8; do
            for variant in qt6 qt5-qwt630; do
              for stage in stage1 stage2 stage3 stage4 stage5; do
                delete_caches_with_prefix "vcpkg-${platform}-${variant}-APP-${stage}-"
              done
            done
          done
