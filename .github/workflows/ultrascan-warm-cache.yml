  macos-stage3-qtmods:
    name: "macOS ARM / ${{ inputs.qt_variant }} — Stage 3: Qt modules + DB"
    if: inputs.platforms == 'all' || inputs.platforms == 'macos'
    runs-on: macos-15
    needs: macos-stage2-qtbase
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
