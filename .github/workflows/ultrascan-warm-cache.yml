          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage3-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}
          restore-keys: |
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage3-
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage2-
            vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-

      - name: Stage 4 — Qwt + QwtPlot3D
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          bash scripts/warm-cache.sh --stage 4 --${{ inputs.qt_variant }}

      - name: Reclaim disk before cache save
        if: always()
        run: rm -rf "$HOME/us3-scratch/vcpkg/buildtrees" "$HOME/vcpkg/buildtrees" || true

      - name: Save vcpkg cache (stage 4)
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-stage4-${{ hashFiles('vcpkg.json', 'admin/cmake/**') }}

      - name: Save vcpkg cache (full-build key)
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-ubuntu-24.04-${{ inputs.qt_variant }}-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}

  # ===========================================================================
  # MACOS-15 (Apple Silicon arm64) — four sequential stages
  # ===========================================================================

  macos-stage1-base:
    name: "macOS ARM / ${{ inputs.qt_variant }} — Stage 1: base libs"
    if: inputs.platforms == 'all' || inputs.platforms == 'macos'
    runs-on: macos-15
