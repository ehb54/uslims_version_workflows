# =============================================================================
# UltraScan3 Reusable Build Workflow
# =============================================================================
# Triggered via workflow_call. Builds UltraScan3 and produces a
# platform-native installer or archive using scripts/build.sh (Linux/macOS)
# or scripts/build.ps1 via scripts/build.bat (Windows).
#
# WHAT THIS WORKFLOW DOES
# -----------------------
# 1. Checkout  - clone the repo at the requested ref
# 2. Cache     - restore/save the vcpkg binary cache
# 3. Build     - invoke build.sh or build.bat with CI=true
# 4. Upload    - publish the platform-native package as a workflow artifact
#
# WHAT THIS WORKFLOW DOES NOT DO
# --------------------------------
# The build scripts own all build logic and machine setup:
#   build.sh     → calls bootstrap-deps.sh (Linux apt) or
#                  bootstrap-macos.sh (Homebrew + Xcode switching);
#                  then runs vcpkg + CMake + package
#   build.ps1    → calls bootstrap-windows.ps1 (winget + VS check);
#                  then runs vcpkg + CMake + package
#   vcpkg.json   → all library dependencies (Qt, Qwt, OpenSSL, …)
#
# Do not add apt/brew/winget/pip calls here. They belong in the bootstrap
# scripts, and CI=true makes those scripts run non-interactively.
#
# INPUTS
# ------
# runner          (required)
#                 GitHub Actions runner label. Determines OS and architecture.
#                 Examples: ubuntu-24.04, ubuntu-24.04-arm, macos-15,
#                           macos-15-xlarge (Apple Silicon), windows-2022
#
# ref             (optional, default: "main")
#                 Branch name, tag, or full 40-character commit SHA to build.
#
# qt_variant      (optional, default: "qt6")
#                 Qt/Qwt combination passed to the build script.
#                 Accepted: qt6 | qt5-qwt616 | qt5-qwt630
#
# profile         (optional, default: "APP")
#                 CMake build profile.
#                   APP   Desktop: GUI + programs + DB connector [default]
#                   TEST  CI: programs + test suite, prefers static libs
#                   HPC   Headless: no GUI, no DB, requires MPI
#
# clean_tier      (optional, default: 0)
#                 How aggressively to wipe prior build state.
#                   0  Incremental - only changed files recompiled
#                   1  --rebuild   - wipes CMake build dir, vcpkg untouched
#                   2  --clean     - wipes build dir + vcpkg installed/ for triplet
#                   3  --clean --purge-cache - tier 2 + wipes binary cache
#
# artifact_name_prefix  (optional, default: "ultrascan")
#                 Prefix for the uploaded artifact name.
#                 Final name: "<prefix>-<runner>-<profile>-<qt_variant>"
#
# artifact_retention_days  (optional, default: 7)
#                 Days to retain uploaded artifacts.
#
# OUTPUT ARTIFACTS
# ----------------
# A platform-native package is always produced and uploaded:
#   Linux   -> build/<preset>/UltraScan3-*-Linux-*.tar.gz
#   macOS   -> build/<preset>/UltraScan3-*-macOS.pkg
#              build/<preset>/UltraScan3-HPC-*-macOS-*.tar.gz  (HPC profile)
#   Windows -> build/<preset>/UltraScan3-*-Windows.exe
#
# EXAMPLE CALLERS
# ---------------
#   jobs:
#     build-ubuntu:
#       uses: ./.github/workflows/ultrascan-reusable-build.yml
#       with:
#         runner: ubuntu-24.04
#         qt_variant: qt5-qwt616
#
#     build-macos-arm:
#       uses: ./.github/workflows/ultrascan-reusable-build.yml
#       with:
#         runner: macos-15-xlarge
#         qt_variant: qt6
#
#     build-windows:
#       uses: ./.github/workflows/ultrascan-reusable-build.yml
#       with:
#         runner: windows-2022
#         qt_variant: qt6
# =============================================================================

name: UltraScan3 Reusable Build

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner label (determines OS and architecture)
        required: true
        type: string

      ref:
        description: "Branch, tag, or full SHA to check out"
        required: false
        type: string
        default: main

      qt_variant:
        description: "Qt/Qwt variant: qt6 | qt5-qwt616 | qt5-qwt630"
        required: false
        type: string
        default: qt6

      profile:
        description: "Build profile: APP | TEST | HPC"
        required: false
        type: string
        default: APP

      clean_tier:
        description: "0=incremental, 1=--rebuild, 2=--clean, 3=--clean --purge-cache"
        required: false
        type: number
        default: 0

      artifact_name_prefix:
        description: Prefix for the uploaded artifact name
        required: false
        type: string
        default: ultrascan

      artifact_retention_days:
        description: Days to retain uploaded artifacts
        required: false
        type: number
        default: 7

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.runner }} / ${{ inputs.profile }} / ${{ inputs.qt_variant }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    steps:
      # -----------------------------------------------------------------------
      # 1. CHECKOUT
      # Clone at the requested ref. fetch-depth: 1 for speed; if the build
      # ever needs git history (e.g. for version tagging) increase this.
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      # -----------------------------------------------------------------------
      # 2. EXECUTABLE PERMISSIONS
      # Git preserves the execute bit when the file is committed with it set,
      # but a safety net here costs nothing and prevents a hard-to-diagnose
      # failure if a script was ever committed without +x.
      # This step only applies on Linux/macOS; Windows runners ignore it.
      # -----------------------------------------------------------------------
      - name: Ensure build scripts are executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x scripts/build.sh scripts/bootstrap-deps.sh scripts/bootstrap-macos.sh

      # -----------------------------------------------------------------------
      # 3. VCPKG BINARY CACHE
      # Keyed on:
      #   - runner label      : encodes OS, version, and architecture
      #   - qt_variant        : different Qt variants install different packages
      #   - vcpkg.json        : baseline + dependency changes
      #   - admin/cmake/      : overlay triplets and ports that affect builds
      #   - CMakeLists.txt    : top-level cmake changes that can affect vcpkg
      #
      # Cache paths cover both Unix (~/.vcpkg-cache) and Windows
      # (C:\Users\runneradmin\.vcpkg-cache) home directory conventions.
      # ~/vcpkg/downloads is included because vcpkg reuses downloaded source
      # archives across port rebuilds even when the binary cache is cold.
      #
      # Note: vcpkg itself (~/.vcpkg or ~/vcpkg) is NOT cached here.
      # build.sh / build.ps1 clone vcpkg on first run and the clone is fast.
      # Caching the full vcpkg directory adds hundreds of MB with little gain
      # since the binary cache already captures the compiled output.
      # -----------------------------------------------------------------------
      - name: Cache vcpkg binary cache and downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.vcpkg-cache
            ~/vcpkg/downloads
            C:\Users\runneradmin\.vcpkg-cache
            C:\Users\runneradmin\vcpkg\downloads
          key: vcpkg-${{ inputs.runner }}-${{ inputs.qt_variant }}-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ inputs.runner }}-${{ inputs.qt_variant }}-
            vcpkg-${{ inputs.runner }}-

      # -----------------------------------------------------------------------
      # 4. BUILD — Linux / macOS
      #
      # CI=true activates non-interactive mode in build.sh and all bootstrap
      # scripts it delegates to:
      #   - bootstrap-deps.sh  (Linux)  : apt-get without prompts
      #   - bootstrap-macos.sh (macOS)  : brew install without prompts,
      #                                   fails loudly if CLT absent
      #   - build.sh itself             : Xcode auto-switch, vcpkg setup,
      #                                   Sphinx pip install, cmake + package
      #
      # Nothing else is needed here. The scripts own all the setup logic.
      # -----------------------------------------------------------------------
      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail

          ARGS=("--${{ inputs.qt_variant }}")

          case "${{ inputs.clean_tier }}" in
            3) ARGS+=("--clean" "--purge-cache") ;;
            2) ARGS+=("--clean") ;;
            1) ARGS+=("--rebuild") ;;
          esac

          ARGS+=("--pkg" "${{ inputs.profile }}")

          echo "Invoking: bash scripts/build.sh ${ARGS[*]}"
          bash scripts/build.sh "${ARGS[@]}"

      # -----------------------------------------------------------------------
      # 4. BUILD — Windows
      #
      # CI=true activates non-interactive mode in build.ps1 and all scripts
      # it delegates to:
      #   - bootstrap-windows.ps1 : winget installs skipped for CiRequired
      #                             tools (cmake/git/ninja/nasm already on
      #                             windows-2022 runner); VS workload verified
      #   - build.ps1 itself      : vcvarsall activation, vcpkg setup,
      #                             Sphinx pip install, cmake + NSIS package
      #
      # build.bat is a thin CMD wrapper that forwards all arguments to
      # build.ps1 via: powershell.exe -ExecutionPolicy Bypass -File build.ps1
      # Using pwsh (PowerShell 7) directly avoids the double-shell hop and
      # gives us consistent exit code propagation.
      # -----------------------------------------------------------------------
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CI: "true"
        run: |
          $ErrorActionPreference = "Stop"

          $BuildArgs = @("--${{ inputs.qt_variant }}")

          $cleanTier = [int]"${{ inputs.clean_tier }}"
          if     ($cleanTier -ge 3) { $BuildArgs += "--clean"; $BuildArgs += "--purge-cache" }
          elseif ($cleanTier -eq 2) { $BuildArgs += "--clean" }
          elseif ($cleanTier -eq 1) { $BuildArgs += "--rebuild" }

          $BuildArgs += "--pkg"
          $BuildArgs += "${{ inputs.profile }}"

          Write-Host "Invoking: scripts\build.ps1 $($BuildArgs -join ' ')"
          & scripts\build.ps1 @BuildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # -----------------------------------------------------------------------
      # 5. UPLOAD ARTIFACT
      #
      # Glob covers all three platforms and both APP and HPC output patterns.
      # if-no-files-found: error ensures a silent packaging failure is never
      # mistaken for a successful build — the build step exits 0 but no file
      # means something went wrong upstream.
      # -----------------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name_prefix }}-${{ inputs.runner }}-${{ inputs.profile }}-${{ inputs.qt_variant }}
          path: |
            build/**/UltraScan3-*-Linux-*.tar.gz
            build/**/UltraScan3-*-macOS.pkg
            build/**/UltraScan3-HPC-*-macOS-*.tar.gz
            build/**/UltraScan3-*-Windows.exe
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
