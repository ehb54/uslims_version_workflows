# =============================================================================
# UltraScan3 Reusable Build Workflow
# =============================================================================
# Triggered via workflow_call. Builds UltraScan3 and produces a
# platform-native installer or archive using scripts/build.sh (Linux/macOS)
# or scripts/build.ps1 via scripts/build.bat (Windows).
#
# WHAT THIS WORKFLOW DOES
# -----------------------
# 1. Checkout  - clone the repo at the requested ref
# 2. Cache     - restore/save the vcpkg binary cache and downloads cache
# 3. Build     - invoke build.sh or build.bat with CI=true
# 4. Upload    - publish the platform-native package as a workflow artifact
#
# WHAT THIS WORKFLOW DOES NOT DO
# --------------------------------
# The build scripts own all build logic and machine setup:
#   build.sh     → calls bootstrap-linux.sh (Linux apt) or
#                  bootstrap-macos.sh (Homebrew + Xcode switching);
#                  then runs vcpkg + CMake + package
#   build.ps1    → calls bootstrap-windows.ps1 (winget + VS check);
#                  then runs vcpkg + CMake + package
#   vcpkg.json   → all library dependencies (Qt, Qwt, OpenSSL, …)
#
# Do not add apt/brew/winget/pip calls here. They belong in the bootstrap
# scripts, and CI=true makes those scripts run non-interactively.
#
# INPUTS
# ------
# runner          (required)
#                 GitHub Actions runner label. Determines OS and architecture.
#                 Examples: ubuntu-24.04, ubuntu-24.04-arm, macos-15,
#                           macos-15-xlarge (Apple Silicon), windows-2022
#
# ref             (optional, default: "main")
#                 Branch name, tag, or full 40-character commit SHA to build.
#
# qt_variant      (optional, default: "qt6")
#                 Qt/Qwt combination passed to the build script.
#                 Accepted: qt6 | qt5-qwt616 | qt5-qwt630
#
# profile         (optional, default: "APP")
#                 CMake build profile.
#                   APP   Desktop: GUI + programs + DB connector [default]
#                   TEST  CI: programs + test suite, prefers static libs
#                   HPC   Headless: no GUI, no DB, requires MPI
#
# clean_tier      (optional, default: "incremental")
#                 How aggressively to wipe prior build state.
#                   incremental       only changed files rebuilt
#                   rebuild           wipe CMake build dir, keep vcpkg cache
#                   clean             wipe build dir + reinstall vcpkg packages
#                   clean-purge-cache full rebuild from source
#
# artifact_name_prefix  (optional)
#                 Prefix used when uploading packaged build artifacts.
#                 The reusable workflow appends the runner/platform name
#                 and a short UTC timestamp.
#                 Final name: "<artifact_name_prefix>-<runner>-<UTC timestamp>"
#                 Example: "ondemand-214-main-APP-qt6-ubuntu-20260309-1445"
#
# artifact_retention_days  (optional, default: 7)
#                 Days to retain uploaded artifacts.
#
# OUTPUT ARTIFACTS
# ----------------
# A platform-native package is always produced and uploaded:
#   Linux   -> build/<preset>/UltraScan3-*-Linux-*.tar.gz
#   macOS   -> build/<preset>/UltraScan3-*-macOS.pkg
#              build/<preset>/UltraScan3-HPC-*-macOS-*.tar.gz  (HPC profile)
#   Windows -> build/<preset>/UltraScan3-*-Windows.exe
#
# EXAMPLE CALLERS
# ---------------
#   jobs:
#     build-ubuntu:
#       uses: ./.github/workflows/ultrascan-reusable-build.yml
#       with:
#         runner: ubuntu-24.04
#         qt_variant: qt5-qwt616
#
#     build-macos-arm:
#       uses: ./.github/workflows/ultrascan-reusable-build.yml
#       with:
#         runner: macos-15-xlarge
#         qt_variant: qt6
#
#     build-windows:
#       uses: ./.github/workflows/ultrascan-reusable-build.yml
#       with:
#         runner: windows-2022
#         qt_variant: qt6
# =============================================================================

name: UltraScan3 Reusable Build

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner label (determines OS and architecture)
        required: true
        type: string

      ref:
        description: "Branch, tag, or full SHA to check out"
        required: false
        type: string
        default: main

      qt_variant:
        description: "Qt/Qwt variant: qt6 | qt5-qwt616 | qt5-qwt630"
        required: false
        type: string
        default: qt6

      profile:
        description: "Build profile: APP | TEST | HPC"
        required: false
        type: string
        default: APP

      clean_tier:
        description: "Clean tier: incremental=reuse build dir, rebuild=wipe build dir, clean=reinstall vcpkg, clean-purge-cache=full source rebuild"
        required: false
        type: string
        default: incremental

      artifact_name_prefix:
        description: Prefix for the uploaded artifact name
        required: false
        type: string
        default: ultrascan

      artifact_retention_days:
        description: Days to retain uploaded artifacts
        required: false
        type: number
        default: 7

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.runner }} / ${{ inputs.profile }} / ${{ inputs.qt_variant }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    steps:
      # -----------------------------------------------------------------------
      # 1. CHECKOUT
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. EXECUTABLE PERMISSIONS
      # Git preserves the execute bit when the file is committed with it set,
      # but a safety net here costs nothing and prevents a hard-to-diagnose
      # failure if a script was ever committed without +x.
      # This step only applies on Linux/macOS; Windows runners ignore it.
      # -----------------------------------------------------------------------
      - name: Ensure build scripts are executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x scripts/build.sh scripts/bootstrap-linux.sh scripts/bootstrap-macos.sh

      # -----------------------------------------------------------------------
      # 3. VCPKG BINARY CACHE
      # Keyed on:
      #   - runner label      : encodes OS, version, and architecture
      #   - qt_variant        : different Qt variants install different packages
      #   - vcpkg.json        : baseline + dependency changes
      #   - admin/cmake/      : overlay triplets and ports that affect builds
      #   - CMakeLists.txt    : top-level cmake changes that can affect vcpkg
      #
      # Cache paths cover both Unix (~/.vcpkg-cache) and Windows
      # (C:\Users\runneradmin\.vcpkg-cache) home directory conventions.
      # ~/vcpkg-downloads is included because vcpkg reuses downloaded source
      # archives across port rebuilds even when the binary cache is cold.
      #
      # Note: vcpkg itself (~/.vcpkg or ~/vcpkg) is NOT cached here.
      # build.sh / build.ps1 clone vcpkg on first run and the clone is fast.
      # Caching the full vcpkg directory adds hundreds of MB with little gain
      # since the binary cache already captures the compiled output.
      # -----------------------------------------------------------------------
      - name: Restore vcpkg binary cache and downloads (Unix)
        if: runner.os != 'Windows'
        id: vcpkg-cache-restore-unix
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-${{ inputs.runner }}-${{ inputs.qt_variant }}-${{ inputs.profile }}-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ inputs.runner }}-${{ inputs.qt_variant }}-${{ inputs.profile }}-
            vcpkg-${{ inputs.runner }}-${{ inputs.qt_variant }}-
            
      - name: Restore vcpkg binary cache and downloads (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-cache-restore-windows
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\Users\runneradmin\.vcpkg-cache
            C:\Users\runneradmin\vcpkg-downloads
          key: vcpkg-${{ inputs.runner }}-${{ inputs.qt_variant }}-${{ inputs.profile }}-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ inputs.runner }}-${{ inputs.qt_variant }}-${{ inputs.profile }}-
            vcpkg-${{ inputs.runner }}-${{ inputs.qt_variant }}-

      - name: Show restored vcpkg cache state (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          echo "=========================================="
          echo "Post-restore cache diagnostics"
          echo "=========================================="
          df -h
          echo "US3_VCPKG_CACHE=$US3_VCPKG_CACHE"
          echo "US3_VCPKG_DOWNLOADS=$US3_VCPKG_DOWNLOADS"
          du -sh "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS" 2>/dev/null || true
          find "$US3_VCPKG_CACHE" -maxdepth 2 | head -n 30 || true
          find "$US3_VCPKG_DOWNLOADS" -maxdepth 2 | head -n 30 || true
      # -----------------------------------------------------------------------
      # 4. BUILD — Linux / macOS
      #
      # CI=true activates non-interactive mode in build.sh and all bootstrap
      # scripts it delegates to:
      #   - bootstrap-linux.sh  (Linux)  : apt-get without prompts
      #   - bootstrap-macos.sh (macOS)  : brew install without prompts,
      #                                   fails loudly if CLT absent
      #   - build.sh itself             : Xcode auto-switch, vcpkg setup,
      #                                   Sphinx pip install, cmake + package
      #
      # Nothing else is needed here. The scripts own all the setup logic.
      # -----------------------------------------------------------------------
      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          set -euo pipefail

          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"

          ARGS=("${{ inputs.profile }}")
          ARGS+=("--${{ inputs.qt_variant }}")
          ARGS+=("--pkg")

          case "${{ inputs.clean_tier }}" in
            incremental)
              ;;
            rebuild)
              ARGS+=("--rebuild")
              ;;
            clean)
              ARGS+=("--clean")
              ;;
            clean-purge-cache)
              ARGS+=("--clean" "--purge-cache")
              ;;
            *)
              echo "Unknown clean_tier: ${{ inputs.clean_tier }}" >&2
              exit 1
              ;;
          esac

          echo "US3_VCPKG_CACHE=$US3_VCPKG_CACHE"
          echo "US3_VCPKG_DOWNLOADS=$US3_VCPKG_DOWNLOADS"

          echo "Invoking: bash scripts/build.sh ${ARGS[*]}"
          bash scripts/build.sh "${ARGS[@]}"

      # -----------------------------------------------------------------------
      # 4. BUILD (Windows)
      #
      # Uses the batch wrapper instead of calling build.ps1 directly.
      # build.bat normalizes Unix-style "--flag" arguments into the PowerShell
      # "-flag" form expected by build.ps1, so Windows can use the same
      # user-facing argument style as Linux/macOS.
      #
      # Profile is passed first so APP / TEST / HPC works positionally the same
      # way across platforms.
      # -----------------------------------------------------------------------
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CI: "true"
        run: |
          $ErrorActionPreference = "Stop"

          $BuildArgs = @("${{ inputs.profile }}", "--${{ inputs.qt_variant }}")

          switch ("${{ inputs.clean_tier }}") {
            "incremental" { }
            "rebuild" { $BuildArgs += "--rebuild" }
            "clean" { $BuildArgs += "--clean" }
            "clean-purge-cache" {
              $BuildArgs += "--clean"
              $BuildArgs += "--purge-cache"
            }
            default {
              Write-Error "Unknown clean_tier: ${{ inputs.clean_tier }}"
              exit 1
            }
          }

          $BuildArgs += "--pkg"

          $env:US3_VCPKG_DOWNLOADS = Join-Path $HOME "vcpkg-downloads"
          New-Item -ItemType Directory -Force -Path $env:US3_VCPKG_DOWNLOADS | Out-Null
          
          Write-Host "Invoking: scripts\build.bat $($BuildArgs -join ' ')"
          & scripts\build.bat @BuildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reclaim disk before cache save (Unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          echo "=========================================="
          echo "Reclaim disk before cache save (Unix)"
          echo "=========================================="
          rm -rf /home/runner/us3-scratch/vcpkg/buildtrees || true
          rm -rf /home/runner/us3-scratch/vcpkg/packages || true
          df -h
          du -sh "${{ runner.temp }}/us3-vcpkg-cache" "${{ runner.temp }}/us3-vcpkg-downloads" 2>/dev/null || true

      - name: Save vcpkg binary cache and downloads (Unix)
        if: always() && runner.os != 'Windows'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: ${{ steps.vcpkg-cache-restore-unix.outputs.cache-primary-key }}

      - name: Save vcpkg binary cache and downloads (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/cache/save@v4
        with:
          path: |
            C:\Users\runneradmin\.vcpkg-cache
            C:\Users\runneradmin\vcpkg-downloads
          key: ${{ steps.vcpkg-cache-restore-windows.outputs.cache-primary-key }}

      # -----------------------------------------------------------------------
      # 5. GENERATE ARTIFACT TIMESTAMP
      #
      # Uses a short UTC timestamp (YYYYMMDD-HHMM) for artifact naming.
      # This keeps artifact names human-readable when multiple on-demand builds
      # of the same branch/profile/Qt variant are triggered close together.
      # -----------------------------------------------------------------------
      - name: Generate artifact timestamp
        if: always()
        id: ts
        shell: bash
        run: echo "value=$(date -u +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 6. UPLOAD ARTIFACT
      #
      # Glob covers all three platforms and both APP and HPC output patterns.
      # if-no-files-found: error ensures a silent packaging failure is never
      # mistaken for a successful build.
      #
      # Artifact name format:
      #   <artifact_name_prefix>-<runner>-<UTC timestamp>
      #
      # The prefix is supplied by the caller workflow and already includes the
      # run number, ref, profile, and Qt variant. The reusable workflow adds:
      #   - runner/platform name
      #   - UTC timestamp for easier sorting and identification
      # -----------------------------------------------------------------------
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name_prefix }}-${{ inputs.runner }}-${{ steps.ts.outputs.value }}
          path: |
            build/**/UltraScan3-*-Linux-*.tar.gz
            build/**/UltraScan3-*-macOS.pkg
            build/**/UltraScan3-HPC-*-macOS-*.tar.gz
            build/**/UltraScan3-*-Windows.exe
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}
