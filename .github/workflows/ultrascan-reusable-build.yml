# Reusable UltraScan3 package build.
#
# Build scripts own platform setup, compilation, and packaging. This workflow
# restores/saves vcpkg filesystem binary caches and uploads exactly one package.

name: UltraScan3 Reusable Build

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner label
        required: true
        type: string
      cache_os_label:
        description: "Set to oraclelinux8 to build inside the Oracle Linux 8 container"
        required: false
        type: string
        default: ""
      ref:
        description: Branch, tag, or full SHA to check out
        required: false
        type: string
        default: main
      qt_variant:
        description: "Qt/Qwt variant: qt6 | qt5-qwt630"
        required: false
        type: string
        default: qt6
      profile:
        description: "Build profile: APP | TEST | HPC"
        required: false
        type: string
        default: APP
      clean_tier:
        description: "Clean tier: incremental | rebuild | clean | clean-purge-cache"
        required: false
        type: string
        default: incremental
      artifact_name_prefix:
        description: Prefix for the uploaded artifact name
        required: false
        type: string
        default: ultrascan
      artifact_platform_label:
        description: User-facing platform and architecture label
        required: false
        type: string
        default: ""
      artifact_retention_days:
        description: Days to retain uploaded artifacts
        required: false
        type: number
        default: 7
      require_exact_cache_hit:
        description: Fail before building unless the standard cache is an exact hit
        required: false
        type: boolean
        default: false
      save_cache:
        description: Save the standard cache after a successful build
        required: false
        type: boolean
        default: true
      windows_split_cache:
        description: Restore the pre-warmed Windows A and B cache partitions read-only
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: ${{ inputs.runner }} / ${{ inputs.profile }} / ${{ inputs.qt_variant }}
    if: inputs.cache_os_label != 'oraclelinux8'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Define vcpkg cache keys
        id: cache-keys
        shell: bash
        env:
          CACHE_OS: ${{ inputs.cache_os_label || runner.os }}
          CACHE_ARCH: ${{ runner.arch }}
          QT_VARIANT: ${{ inputs.qt_variant }}
          PROFILE: ${{ inputs.profile }}
          FINGERPRINT: ${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'buildsys/vcpkg/overlay-ports/**', 'admin/cmake/triplets/**', 'admin/cmake/toolchain.cmake', 'scripts/warm-cache.sh', 'scripts/warm-cache-windows.ps1') }}
        run: |
          set -euo pipefail
          cache_os=$(printf '%s' "$CACHE_OS" | tr '[:upper:]' '[:lower:]')
          cache_arch=$(printf '%s' "$CACHE_ARCH" | tr '[:upper:]' '[:lower:]')
          prefix="vcpkg-${cache_os}-${cache_arch}-${QT_VARIANT}-${PROFILE}"
          {
            echo "prefix=${prefix}"
            echo "primary=${prefix}-${FINGERPRINT}"
            echo "partition-a=${prefix}-a-${FINGERPRINT}"
            echo "partition-b=${prefix}-b-${FINGERPRINT}"
          } >> "$GITHUB_OUTPUT"

      - name: Delete requested standard cache
        if: inputs.clean_tier == 'clean-purge-cache' && inputs.windows_split_cache == false
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.cache-keys.outputs.primary }}
        run: gh cache delete "$CACHE_KEY" --repo "$GITHUB_REPOSITORY" || true

      - name: Restore standard vcpkg binary cache
        if: inputs.windows_split_cache == false
        id: cache-standard
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: ${{ steps.cache-keys.outputs.primary }}
          restore-keys: ${{ inputs.clean_tier == 'clean-purge-cache' && '' || format('{0}-', steps.cache-keys.outputs.prefix) }}
          fail-on-cache-miss: ${{ inputs.require_exact_cache_hit }}

      - name: Restore Windows vcpkg cache partition A
        if: runner.os == 'Windows' && inputs.windows_split_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}\us3-vcpkg-cache-a
          key: ${{ steps.cache-keys.outputs.partition-a }}
          fail-on-cache-miss: true

      - name: Restore Windows vcpkg cache partition B
        if: runner.os == 'Windows' && inputs.windows_split_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}\us3-vcpkg-cache-b
          key: ${{ steps.cache-keys.outputs.partition-b }}
          fail-on-cache-miss: true

      - name: Ensure build scripts are executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x scripts/build.sh scripts/bootstrap-linux.sh scripts/bootstrap-macos.sh

      - name: Build and package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          set -euo pipefail
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          args=("${{ inputs.profile }}" "--${{ inputs.qt_variant }}" "--pkg")
          case "${{ inputs.clean_tier }}" in
            incremental) ;;
            rebuild) args+=("--rebuild") ;;
            clean) args+=("--clean") ;;
            clean-purge-cache) args+=("--clean" "--purge-cache") ;;
            *) echo "Unknown clean_tier: ${{ inputs.clean_tier }}" >&2; exit 1 ;;
          esac
          bash scripts/build.sh "${args[@]}"

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ inputs.windows_split_cache && format('{0}\us3-vcpkg-cache-b', runner.temp) || format('{0}\us3-vcpkg-cache', runner.temp) }}
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}\us3-vcpkg-downloads
          VCPKG_BINARY_SOURCES: ${{ inputs.windows_split_cache && format('clear;files,{0}\us3-vcpkg-cache-a,read;files,{0}\us3-vcpkg-cache-b,read', runner.temp) || '' }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path $env:US3_VCPKG_CACHE, $env:US3_VCPKG_DOWNLOADS | Out-Null
          $BuildArgs = @("${{ inputs.profile }}", "--${{ inputs.qt_variant }}", "--pkg")
          switch ("${{ inputs.clean_tier }}") {
            "incremental" { }
            "rebuild" { $BuildArgs += "--rebuild" }
            "clean" { $BuildArgs += "--clean" }
            "clean-purge-cache" { $BuildArgs += "--clean"; $BuildArgs += "--purge-cache" }
            default { throw "Unknown clean_tier: ${{ inputs.clean_tier }}" }
          }
          & scripts\build.bat @BuildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save standard vcpkg binary cache
        if: success() && inputs.windows_split_cache == false && inputs.save_cache && steps.cache-standard.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: ${{ steps.cache-keys.outputs.primary }}

      - name: Stage packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact-upload
          mkdir -p artifact-upload
          find_packages() {
            find build -type f -not -path '*/_CPack_Packages/*' \( \
              -name 'UltraScan3-*-Linux-*.tar.xz' -o \
              -name 'UltraScan3-*-macOS.pkg' -o \
              -name 'UltraScan3-HPC-*-macOS-*.tar.gz' -o \
              -name 'UltraScan3-*-Windows.exe' \
            \)
          }
          package_count=$(find_packages | wc -l | tr -d ' ')
          if [[ $package_count -ne 1 ]]; then
            printf 'Expected exactly one packaged artifact, found %d:\n' "$package_count" >&2
            find_packages >&2
            exit 1
          fi
          package=$(find_packages)
          cp "$package" artifact-upload/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name_prefix }}-${{ inputs.artifact_platform_label || inputs.runner }}
          path: artifact-upload/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  build-oraclelinux8:
    name: oraclelinux8-x64 / ${{ inputs.profile }} / ${{ inputs.qt_variant }}
    if: inputs.cache_os_label == 'oraclelinux8'
    runs-on: ${{ inputs.runner }}
    container:
      image: oraclelinux:8
    timeout-minutes: 360
    steps:
      - name: Install Git for metadata-aware checkout
        shell: bash
        run: dnf install -y git

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify Git build metadata
        shell: bash
        run: |
          set -euo pipefail
          test -d .git
          git rev-parse --verify HEAD
          git rev-list --count HEAD

      - name: Define vcpkg cache key
        id: cache-key
        shell: bash
        env:
          FINGERPRINT: ${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'buildsys/vcpkg/overlay-ports/**', 'admin/cmake/triplets/**', 'admin/cmake/toolchain.cmake', 'scripts/warm-cache.sh') }}
        run: echo "primary=vcpkg-oraclelinux8-x64-${{ inputs.qt_variant }}-${{ inputs.profile }}-${FINGERPRINT}" >> "$GITHUB_OUTPUT"

      - name: Delete requested vcpkg cache
        if: inputs.clean_tier == 'clean-purge-cache'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.cache-key.outputs.primary }}
        run: gh cache delete "$CACHE_KEY" --repo "$GITHUB_REPOSITORY" || true

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: ${{ steps.cache-key.outputs.primary }}
          restore-keys: ${{ inputs.clean_tier == 'clean-purge-cache' && '' || format('vcpkg-oraclelinux8-x64-{0}-{1}-', inputs.qt_variant, inputs.profile) }}
          fail-on-cache-miss: ${{ inputs.require_exact_cache_hit }}

      - name: Ensure build scripts are executable
        shell: bash
        run: chmod +x scripts/build.sh scripts/bootstrap-linux.sh

      - name: Build and package
        shell: bash
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          set -euo pipefail
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          args=("${{ inputs.profile }}" "--${{ inputs.qt_variant }}" "--pkg")
          case "${{ inputs.clean_tier }}" in
            incremental) ;;
            rebuild) args+=("--rebuild") ;;
            clean) args+=("--clean") ;;
            clean-purge-cache) args+=("--clean" "--purge-cache") ;;
            *) echo "Unknown clean_tier: ${{ inputs.clean_tier }}" >&2; exit 1 ;;
          esac
          bash scripts/build.sh "${args[@]}"

      - name: Save vcpkg binary cache
        if: success() && inputs.save_cache
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: ${{ steps.cache-key.outputs.primary }}

      - name: Stage packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact-upload
          mkdir -p artifact-upload
          find_packages() {
            find build -type f -not -path '*/_CPack_Packages/*' -name 'UltraScan3-*-Linux-*.tar.xz'
          }
          package_count=$(find_packages | wc -l | tr -d ' ')
          if [[ $package_count -ne 1 ]]; then
            printf 'Expected exactly one packaged artifact, found %d:\n' "$package_count" >&2
            find_packages >&2
            exit 1
          fi
          package=$(find_packages)
          cp "$package" artifact-upload/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name_prefix }}-${{ inputs.artifact_platform_label || 'oraclelinux8' }}
          path: artifact-upload/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
