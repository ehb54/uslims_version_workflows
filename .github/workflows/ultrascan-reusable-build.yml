# =============================================================================
# UltraScan3 Reusable Build Workflow
# =============================================================================
# Triggered via workflow_call. Builds UltraScan3 and produces a
# platform-native installer or archive using scripts/build.sh (Linux/macOS)
# or scripts/build.ps1 via scripts/build.bat (Windows).
#
# WHAT THIS WORKFLOW DOES
# -----------------------
# 1. Checkout  - clone the repo at the requested ref
# 2. Cache     - restore/save the vcpkg binary cache
# 3. Build     - invoke build.sh or build.bat with CI=true
# 4. Upload    - publish the platform-native package as a workflow artifact
#
# WHAT THIS WORKFLOW DOES NOT DO
# --------------------------------
# The build scripts own all build logic and machine setup:
#   build.sh     → calls bootstrap-linux.sh (Linux apt/dnf) or
#                  bootstrap-macos.sh (Homebrew + Xcode switching);
#                  then runs vcpkg + CMake + package
#   build.ps1    → calls bootstrap-windows.ps1 (winget + VS check);
#                  then runs vcpkg + CMake + package
#   vcpkg.json   → all library dependencies (Qt, Qwt, OpenSSL, …)
#
# Do not add apt/brew/winget/pip calls here. They belong in the bootstrap
# scripts, and CI=true makes those scripts run non-interactively.
#
# INPUTS
# ------
# runner          (required)
#                 GitHub Actions runner label. Determines OS and architecture.
#                 Examples: ubuntu-24.04, ubuntu-24.04-arm, macos-15,
#                           macos-15-xlarge (Apple Silicon), windows-2022
#                 For Rocky 8: pass ubuntu-24.04 and set cache_os_label=rocky8.
#
# cache_os_label  (optional, default: same as runner)
#                 Override the OS label used in vcpkg cache keys.
#                 Use this when the actual runner differs from the target OS,
#                 e.g. building Oracle Linux 8 inside a container on ubuntu-24.04:
#                   runner: ubuntu-24.04
#                   cache_os_label: oraclelinux8
#                 When set to "oraclelinux8" a dedicated job runs the build inside
#                 an oraclelinux:8 container. This keeps Oracle Linux 8 binaries
#                 isolated from Ubuntu binaries (different glibc version).
#
# ref             (optional, default: "main")
#                 Branch name, tag, or full 40-character commit SHA to build.
#
# qt_variant      (optional, default: "qt6")
#                 Qt/Qwt combination passed to the build script.
#                 Accepted: qt6 | qt5-qwt630
#                 qt5-qwt616 is retired; callers should pass qt5-qwt630.
#
# profile         (optional, default: "APP")
#                 CMake build profile.
#                   APP   Desktop: GUI + programs + DB connector [default]
#                   TEST  CI: programs + test suite, prefers static libs
#                   HPC   Headless: no GUI, no DB, requires MPI
#
# clean_tier      (optional, default: "incremental")
#                 How aggressively to wipe prior build state.
#                   incremental       only changed files rebuilt
#                   rebuild           wipe CMake build dir, keep vcpkg cache
#                   clean             wipe build dir + reinstall vcpkg packages
#                   clean-purge-cache full rebuild from source
#
# artifact_name_prefix  (optional)
#                 Prefix used when uploading packaged build artifacts.
#                 The reusable workflow appends the runner/platform name.
#                 Final name: "<artifact_name_prefix>-<runner>"
#                 Callers should put stable build identity (version, run, SHA)
#                 in the prefix rather than relying on a wall-clock timestamp.
#
# artifact_retention_days  (optional, default: 7)
#                 Days to retain uploaded artifacts.
#
# OUTPUT ARTIFACTS
# ----------------
# A platform-native package is always produced and uploaded:
#   Linux   -> build/<preset>/UltraScan3-*-Linux-*.tar.xz
#              build/<preset>/UltraScan3-HPC-*-Linux-*.tar.xz  (HPC profile)
#   macOS   -> build/<preset>/UltraScan3-*-macOS.pkg
#              build/<preset>/UltraScan3-HPC-*-macOS-*.tar.gz  (HPC profile)
#   Windows -> build/<preset>/UltraScan3-*-Windows.exe
#
# EXAMPLE CALLERS
# ---------------
#   jobs:
#     build-ubuntu:
#       uses: ./.github/workflows/ultrascan-reusable-build.yml
#       with:
#         runner: ubuntu-24.04
#         qt_variant: qt5-qwt630
#
#     build-oraclelinux8:
#       uses: ./.github/workflows/ultrascan-reusable-build.yml
#       with:
#         runner: ubuntu-24.04
#         cache_os_label: oraclelinux8
#         qt_variant: qt6
#
#     build-macos-arm:
#       uses: ./.github/workflows/ultrascan-reusable-build.yml
#       with:
#         runner: macos-15-xlarge
#         qt_variant: qt6
#
#     build-windows:
#       uses: ./.github/workflows/ultrascan-reusable-build.yml
#       with:
#         runner: windows-2022
#         qt_variant: qt6
# =============================================================================

name: UltraScan3 Reusable Build

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner label (determines OS and architecture)
        required: true
        type: string

      cache_os_label:
        description: "Override the OS label in vcpkg cache keys (e.g. rocky8). Set to 'rocky8' to run inside a rockylinux:8 container."
        required: false
        type: string
        default: ""

      ref:
        description: "Branch, tag, or full SHA to check out"
        required: false
        type: string
        default: main

      qt_variant:
        description: "Qt/Qwt variant: qt6 | qt5-qwt630"
        required: false
        type: string
        default: qt6

      profile:
        description: "Build profile: APP | TEST | HPC"
        required: false
        type: string
        default: APP

      clean_tier:
        description: "Clean tier: incremental=reuse build dir, rebuild=wipe build dir, clean=reinstall vcpkg, clean-purge-cache=full source rebuild"
        required: false
        type: string
        default: incremental

      artifact_name_prefix:
        description: Prefix for the uploaded artifact name
        required: false
        type: string
        default: ultrascan

      artifact_retention_days:
        description: Days to retain uploaded artifacts
        required: false
        type: number
        default: 7

      require_exact_cache_hit:
        description: "If true, fail before any build step when the vcpkg cache restore was not an exact hit (cache-hit != 'true')"
        required: false
        type: boolean
        default: false

      save_cache:
        description: "If false, skip all vcpkg cache save steps"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:

  # ===========================================================================
  # STANDARD BUILD
  # Runs on the specified runner natively (Ubuntu, macOS, Windows).
  # Skipped when cache_os_label=oraclelinux8 — that uses the container job below.
  # ===========================================================================
  build:
    name: ${{ inputs.runner }} / ${{ inputs.profile }} / ${{ inputs.qt_variant }}
    if: inputs.cache_os_label != 'oraclelinux8'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Ensure build scripts are executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x scripts/build.sh scripts/bootstrap-linux.sh scripts/bootstrap-macos.sh

      - name: Restore vcpkg binary cache (Unix)
        if: runner.os != 'Windows'
        id: vcpkg-cache-restore-unix
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-${{ inputs.cache_os_label || inputs.runner }}-${{ inputs.qt_variant }}-${{ inputs.profile }}-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}
          restore-keys: |
            vcpkg-${{ inputs.cache_os_label || inputs.runner }}-${{ inputs.qt_variant }}-${{ inputs.profile }}-
            vcpkg-${{ inputs.cache_os_label || inputs.runner }}-${{ inputs.qt_variant }}-

      - name: Restore vcpkg binary cache (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-cache-restore-windows
        uses: actions/cache/restore@v5
        with:
          path: C:\Users\runneradmin\.vcpkg-cache
          key: vcpkg-${{ inputs.cache_os_label || inputs.runner }}-${{ inputs.qt_variant }}-${{ inputs.profile }}-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ inputs.cache_os_label || inputs.runner }}-${{ inputs.qt_variant }}-${{ inputs.profile }}-
            vcpkg-${{ inputs.cache_os_label || inputs.runner }}-${{ inputs.qt_variant }}-

      - name: Restore vcpkg binary cache (Unix) — retry 1
        if: runner.os != 'Windows' && inputs.require_exact_cache_hit && steps.vcpkg-cache-restore-unix.outputs.cache-hit != 'true'
        id: vcpkg-cache-restore-unix-r1
        shell: bash
        run: sleep 30
      - name: Restore vcpkg binary cache (Unix) — retry 1 fetch
        if: runner.os != 'Windows' && inputs.require_exact_cache_hit && steps.vcpkg-cache-restore-unix.outputs.cache-hit != 'true'
        id: vcpkg-cache-restore-unix-r1-fetch
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-${{ inputs.cache_os_label || inputs.runner }}-${{ inputs.qt_variant }}-${{ inputs.profile }}-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}

      - name: Restore vcpkg binary cache (Unix) — retry 2
        if: runner.os != 'Windows' && inputs.require_exact_cache_hit && steps.vcpkg-cache-restore-unix.outputs.cache-hit != 'true' && steps.vcpkg-cache-restore-unix-r1-fetch.outputs.cache-hit != 'true'
        id: vcpkg-cache-restore-unix-r2
        shell: bash
        run: sleep 30
      - name: Restore vcpkg binary cache (Unix) — retry 2 fetch
        if: runner.os != 'Windows' && inputs.require_exact_cache_hit && steps.vcpkg-cache-restore-unix.outputs.cache-hit != 'true' && steps.vcpkg-cache-restore-unix-r1-fetch.outputs.cache-hit != 'true'
        id: vcpkg-cache-restore-unix-r2-fetch
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-${{ inputs.cache_os_label || inputs.runner }}-${{ inputs.qt_variant }}-${{ inputs.profile }}-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}

      - name: Enforce exact cache hit (Unix)
        if: runner.os != 'Windows' && inputs.require_exact_cache_hit && steps.vcpkg-cache-restore-unix.outputs.cache-hit != 'true' && steps.vcpkg-cache-restore-unix-r1-fetch.outputs.cache-hit != 'true' && steps.vcpkg-cache-restore-unix-r2-fetch.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "::error::vcpkg cache not found after 3 attempts (require_exact_cache_hit=true). Cache must be pre-warmed before release. Aborting build."
          exit 1

      - name: Restore vcpkg binary cache (Windows) — retry 1
        if: runner.os == 'Windows' && inputs.require_exact_cache_hit && steps.vcpkg-cache-restore-windows.outputs.cache-hit != 'true'
        id: vcpkg-cache-restore-windows-r1
        shell: bash
        run: sleep 30
      - name: Restore vcpkg binary cache (Windows) — retry 1 fetch
        if: runner.os == 'Windows' && inputs.require_exact_cache_hit && steps.vcpkg-cache-restore-windows.outputs.cache-hit != 'true'
        id: vcpkg-cache-restore-windows-r1-fetch
        uses: actions/cache/restore@v5
        with:
          path: C:\Users\runneradmin\.vcpkg-cache
          key: vcpkg-${{ inputs.cache_os_label || inputs.runner }}-${{ inputs.qt_variant }}-${{ inputs.profile }}-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}

      - name: Restore vcpkg binary cache (Windows) — retry 2
        if: runner.os == 'Windows' && inputs.require_exact_cache_hit && steps.vcpkg-cache-restore-windows.outputs.cache-hit != 'true' && steps.vcpkg-cache-restore-windows-r1-fetch.outputs.cache-hit != 'true'
        id: vcpkg-cache-restore-windows-r2
        shell: bash
        run: sleep 30
      - name: Restore vcpkg binary cache (Windows) — retry 2 fetch
        if: runner.os == 'Windows' && inputs.require_exact_cache_hit && steps.vcpkg-cache-restore-windows.outputs.cache-hit != 'true' && steps.vcpkg-cache-restore-windows-r1-fetch.outputs.cache-hit != 'true'
        id: vcpkg-cache-restore-windows-r2-fetch
        uses: actions/cache/restore@v5
        with:
          path: C:\Users\runneradmin\.vcpkg-cache
          key: vcpkg-${{ inputs.cache_os_label || inputs.runner }}-${{ inputs.qt_variant }}-${{ inputs.profile }}-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}

      - name: Enforce exact cache hit (Windows)
        if: runner.os == 'Windows' && inputs.require_exact_cache_hit && steps.vcpkg-cache-restore-windows.outputs.cache-hit != 'true' && steps.vcpkg-cache-restore-windows-r1-fetch.outputs.cache-hit != 'true' && steps.vcpkg-cache-restore-windows-r2-fetch.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "::error::vcpkg cache not found after 3 attempts (require_exact_cache_hit=true). Cache must be pre-warmed before release. Aborting build."
          exit 1

      - name: Show restored vcpkg cache state (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          echo "=========================================="
          echo "Post-restore cache diagnostics"
          echo "=========================================="
          df -h
          echo "US3_VCPKG_CACHE=$US3_VCPKG_CACHE"
          echo "US3_VCPKG_DOWNLOADS=$US3_VCPKG_DOWNLOADS"
          du -sh "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS" 2>/dev/null || true
          find "$US3_VCPKG_CACHE" -maxdepth 2 | head -n 30 || true
          find "$US3_VCPKG_DOWNLOADS" -maxdepth 2 | head -n 30 || true

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          set -euo pipefail
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          ARGS=("${{ inputs.profile }}")
          ARGS+=("--${{ inputs.qt_variant }}")
          ARGS+=("--pkg")
          case "${{ inputs.clean_tier }}" in
            incremental)       ;;
            rebuild)           ARGS+=("--rebuild") ;;
            clean)             ARGS+=("--clean") ;;
            clean-purge-cache) ARGS+=("--clean" "--purge-cache") ;;
            *) echo "Unknown clean_tier: ${{ inputs.clean_tier }}" >&2; exit 1 ;;
          esac
          echo "Invoking: bash scripts/build.sh ${ARGS[*]}"
          bash scripts/build.sh "${ARGS[@]}"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CI: "true"
        run: |
          $ErrorActionPreference = "Stop"
          $BuildArgs = @("${{ inputs.profile }}", "--${{ inputs.qt_variant }}")
          switch ("${{ inputs.clean_tier }}") {
            "incremental"       { }
            "rebuild"           { $BuildArgs += "--rebuild" }
            "clean"             { $BuildArgs += "--clean" }
            "clean-purge-cache" { $BuildArgs += "--clean"; $BuildArgs += "--purge-cache" }
            default { Write-Error "Unknown clean_tier: ${{ inputs.clean_tier }}"; exit 1 }
          }
          $BuildArgs += "--pkg"
          $env:US3_VCPKG_DOWNLOADS = Join-Path $HOME "vcpkg-downloads"
          New-Item -ItemType Directory -Force -Path $env:US3_VCPKG_DOWNLOADS | Out-Null
          Write-Host "Invoking: scripts\build.bat $($BuildArgs -join ' ')"
          & scripts\build.bat @BuildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reclaim disk before cache save (Unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          rm -rf /home/runner/us3-scratch/vcpkg/buildtrees || true
          rm -rf /home/runner/us3-scratch/vcpkg/packages || true
          df -h
          du -sh "${{ runner.temp }}/us3-vcpkg-cache" 2>/dev/null || true

      - name: Save vcpkg binary cache (Unix)
        if: success() && runner.os != 'Windows' && inputs.save_cache
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: ${{ steps.vcpkg-cache-restore-unix.outputs.cache-primary-key }}

      - name: Save vcpkg binary cache (Windows)
        if: success() && runner.os == 'Windows' && inputs.save_cache
        uses: actions/cache/save@v5
        with:
          path: C:\Users\runneradmin\.vcpkg-cache
          key: ${{ steps.vcpkg-cache-restore-windows.outputs.cache-primary-key }}

      - name: Stage packaged artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .artifact-upload
          mkdir -p .artifact-upload

          find_packages() {
            find build -type f \( \
              -name 'UltraScan3-*-Linux-*.tar.xz' -o \
              -name 'UltraScan3-*-macOS.pkg' -o \
              -name 'UltraScan3-HPC-*-macOS-*.tar.gz' -o \
              -name 'UltraScan3-*-Windows.exe' \
            \)
          }
          package_count=$(find_packages | wc -l | tr -d ' ')

          if [[ $package_count -ne 1 ]]; then
            printf 'Expected exactly one packaged artifact, found %d:\n' "$package_count" >&2
            find_packages >&2
            exit 1
          fi

          package=$(find_packages)
          cp "$package" .artifact-upload/

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name_prefix }}-${{ inputs.runner }}
          path: .artifact-upload/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  # ===========================================================================
  # ORACLE LINUX 8 BUILD
  # Runs inside an oraclelinux:8 container on the specified runner (ubuntu-24.04).
  # The container: key must be static — it cannot be driven from an input —
  # so Oracle Linux 8 requires this dedicated job.
  # Cache keys use "oraclelinux8" to isolate from Ubuntu binaries (different glibc).
  # ===========================================================================
  build-oraclelinux8:
    name: oraclelinux8-x64 / ${{ inputs.profile }} / ${{ inputs.qt_variant }}
    if: inputs.cache_os_label == 'oraclelinux8'
    runs-on: ${{ inputs.runner }}
    container:
      image: oraclelinux:8
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Ensure build scripts are executable
        shell: bash
        run: chmod +x scripts/build.sh scripts/bootstrap-linux.sh

      - name: Restore vcpkg binary cache
        id: vcpkg-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-oraclelinux8-${{ inputs.qt_variant }}-${{ inputs.profile }}-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}
          restore-keys: |
            vcpkg-oraclelinux8-${{ inputs.qt_variant }}-${{ inputs.profile }}-
            vcpkg-oraclelinux8-${{ inputs.qt_variant }}-

      - name: Restore vcpkg binary cache — retry 1
        if: inputs.require_exact_cache_hit && steps.vcpkg-cache-restore.outputs.cache-hit != 'true'
        id: vcpkg-cache-restore-r1
        shell: bash
        run: sleep 30
      - name: Restore vcpkg binary cache — retry 1 fetch
        if: inputs.require_exact_cache_hit && steps.vcpkg-cache-restore.outputs.cache-hit != 'true'
        id: vcpkg-cache-restore-r1-fetch
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-oraclelinux8-${{ inputs.qt_variant }}-${{ inputs.profile }}-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}

      - name: Restore vcpkg binary cache — retry 2
        if: inputs.require_exact_cache_hit && steps.vcpkg-cache-restore.outputs.cache-hit != 'true' && steps.vcpkg-cache-restore-r1-fetch.outputs.cache-hit != 'true'
        id: vcpkg-cache-restore-r2
        shell: bash
        run: sleep 30
      - name: Restore vcpkg binary cache — retry 2 fetch
        if: inputs.require_exact_cache_hit && steps.vcpkg-cache-restore.outputs.cache-hit != 'true' && steps.vcpkg-cache-restore-r1-fetch.outputs.cache-hit != 'true'
        id: vcpkg-cache-restore-r2-fetch
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-oraclelinux8-${{ inputs.qt_variant }}-${{ inputs.profile }}-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}

      - name: Enforce exact cache hit
        if: inputs.require_exact_cache_hit && steps.vcpkg-cache-restore.outputs.cache-hit != 'true' && steps.vcpkg-cache-restore-r1-fetch.outputs.cache-hit != 'true' && steps.vcpkg-cache-restore-r2-fetch.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "::error::vcpkg cache not found after 3 attempts (require_exact_cache_hit=true). Cache must be pre-warmed before release. Aborting build."
          exit 1

      - name: Show restored vcpkg cache state
        shell: bash
        env:
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          echo "=========================================="
          echo "Post-restore cache diagnostics"
          echo "=========================================="
          df -h
          du -sh "$US3_VCPKG_CACHE" 2>/dev/null || true

      - name: Build
        shell: bash
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}/us3-vcpkg-cache
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
        run: |
          set -euo pipefail
          mkdir -p "$US3_VCPKG_CACHE" "$US3_VCPKG_DOWNLOADS"
          ARGS=("${{ inputs.profile }}")
          ARGS+=("--${{ inputs.qt_variant }}")
          ARGS+=("--pkg")
          case "${{ inputs.clean_tier }}" in
            incremental)       ;;
            rebuild)           ARGS+=("--rebuild") ;;
            clean)             ARGS+=("--clean") ;;
            clean-purge-cache) ARGS+=("--clean" "--purge-cache") ;;
            *) echo "Unknown clean_tier: ${{ inputs.clean_tier }}" >&2; exit 1 ;;
          esac
          echo "Invoking: bash scripts/build.sh ${ARGS[*]}"
          bash scripts/build.sh "${ARGS[@]}"

      - name: Reclaim disk before cache save
        if: always()
        shell: bash
        run: |
          rm -rf /root/us3-scratch/vcpkg/buildtrees || true
          rm -rf /root/vcpkg/buildtrees || true
          df -h
          du -sh "${{ runner.temp }}/us3-vcpkg-cache" 2>/dev/null || true

      - name: Save vcpkg binary cache
        if: success() && inputs.save_cache
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: ${{ steps.vcpkg-cache-restore.outputs.cache-primary-key }}

      - name: Stage packaged artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .artifact-upload
          mkdir -p .artifact-upload

          find_packages() {
            find build -type f -name 'UltraScan3-*-Linux-*.tar.xz'
          }
          package_count=$(find_packages | wc -l | tr -d ' ')

          if [[ $package_count -ne 1 ]]; then
            printf 'Expected exactly one packaged artifact, found %d:\n' "$package_count" >&2
            find_packages >&2
            exit 1
          fi

          package=$(find_packages)
          cp "$package" .artifact-upload/

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name_prefix }}-oraclelinux8
          path: .artifact-upload/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
