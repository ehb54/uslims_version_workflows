# Reusable UltraScan3 package build.
#
# The repository build scripts own platform setup, vcpkg/CMake configuration,
# compilation, and packaging. This workflow supplies GitHub Packages credentials
# for vcpkg's native package-level binary cache and uploads exactly one package.

name: UltraScan3 Reusable Build

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner label
        required: true
        type: string
      cache_os_label:
        description: "Set to oraclelinux8 to build inside the Oracle Linux 8 container"
        required: false
        type: string
        default: ""
      ref:
        description: Branch, tag, or full SHA to check out
        required: false
        type: string
        default: main
      qt_variant:
        description: "Qt/Qwt variant: qt6 | qt5-qwt630"
        required: false
        type: string
        default: qt6
      profile:
        description: "Build profile: APP | TEST | HPC"
        required: false
        type: string
        default: APP
      clean_tier:
        description: "Clean tier: incremental | rebuild | clean | clean-purge-cache"
        required: false
        type: string
        default: incremental
      artifact_name_prefix:
        description: Prefix for the uploaded artifact name
        required: false
        type: string
        default: ultrascan
      artifact_platform_label:
        description: "User-facing platform and architecture label"
        required: false
        type: string
        default: ""
      artifact_retention_days:
        description: Days to retain uploaded artifacts
        required: false
        type: number
        default: 7
      require_exact_cache_hit:
        description: "Deprecated compatibility input; vcpkg restores packages by ABI"
        required: false
        type: boolean
        default: false
      save_cache:
        description: "Deprecated compatibility input; vcpkg publishes completed packages immediately"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ inputs.runner }} / ${{ inputs.profile }} / ${{ inputs.qt_variant }}
    if: inputs.cache_os_label != 'oraclelinux8'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Ensure build scripts are executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x scripts/build.sh scripts/bootstrap-linux.sh scripts/bootstrap-macos.sh

      - name: Build and package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CI: "true"
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
          US3_VCPKG_NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          US3_VCPKG_NUGET_USER: ${{ github.repository_owner }}
          US3_VCPKG_NUGET_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$US3_VCPKG_DOWNLOADS"
          args=("${{ inputs.profile }}" "--${{ inputs.qt_variant }}" "--pkg")
          case "${{ inputs.clean_tier }}" in
            incremental) ;;
            rebuild) args+=("--rebuild") ;;
            clean) args+=("--clean") ;;
            clean-purge-cache) args+=("--clean" "--purge-cache") ;;
            *) echo "Unknown clean_tier: ${{ inputs.clean_tier }}" >&2; exit 1 ;;
          esac
          bash scripts/build.sh "${args[@]}"

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CI: "true"
          US3_VCPKG_NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          US3_VCPKG_NUGET_USER: ${{ github.repository_owner }}
          US3_VCPKG_NUGET_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $BuildArgs = @("${{ inputs.profile }}", "--${{ inputs.qt_variant }}", "--pkg")
          switch ("${{ inputs.clean_tier }}") {
            "incremental" { }
            "rebuild" { $BuildArgs += "--rebuild" }
            "clean" { $BuildArgs += "--clean" }
            "clean-purge-cache" { $BuildArgs += "--clean"; $BuildArgs += "--purge-cache" }
            default { throw "Unknown clean_tier: ${{ inputs.clean_tier }}" }
          }
          $env:US3_VCPKG_DOWNLOADS = Join-Path $HOME "vcpkg-downloads"
          New-Item -ItemType Directory -Force -Path $env:US3_VCPKG_DOWNLOADS | Out-Null
          & scripts\build.bat @BuildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact-upload
          mkdir -p artifact-upload
          find_packages() {
            find build -type f -not -path '*/_CPack_Packages/*' \( \
              -name 'UltraScan3-*-Linux-*.tar.xz' -o \
              -name 'UltraScan3-*-macOS.pkg' -o \
              -name 'UltraScan3-HPC-*-macOS-*.tar.gz' -o \
              -name 'UltraScan3-*-Windows.exe' \
            \)
          }
          package_count=$(find_packages | wc -l | tr -d ' ')
          if [[ $package_count -ne 1 ]]; then
            printf 'Expected exactly one packaged artifact, found %d:\n' "$package_count" >&2
            find_packages >&2
            exit 1
          fi
          package=$(find_packages)
          cp "$package" artifact-upload/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name_prefix }}-${{ inputs.artifact_platform_label || inputs.runner }}
          path: artifact-upload/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  build-oraclelinux8:
    name: oraclelinux8-x64 / ${{ inputs.profile }} / ${{ inputs.qt_variant }}
    if: inputs.cache_os_label == 'oraclelinux8'
    runs-on: ${{ inputs.runner }}
    container:
      image: oraclelinux:8
    timeout-minutes: 360
    steps:
      # checkout needs Git so build metadata is available inside the container.
      - name: Install Git for metadata-aware checkout
        shell: bash
        run: dnf install -y git

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify Git build metadata
        shell: bash
        run: |
          set -euo pipefail
          test -d .git
          git rev-parse --verify HEAD
          git rev-list --count HEAD

      - name: Ensure build scripts are executable
        shell: bash
        run: chmod +x scripts/build.sh scripts/bootstrap-linux.sh

      - name: Build and package
        shell: bash
        env:
          CI: "true"
          US3_VCPKG_DOWNLOADS: ${{ runner.temp }}/us3-vcpkg-downloads
          US3_VCPKG_NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          US3_VCPKG_NUGET_USER: ${{ github.repository_owner }}
          US3_VCPKG_NUGET_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$US3_VCPKG_DOWNLOADS"
          args=("${{ inputs.profile }}" "--${{ inputs.qt_variant }}" "--pkg")
          case "${{ inputs.clean_tier }}" in
            incremental) ;;
            rebuild) args+=("--rebuild") ;;
            clean) args+=("--clean") ;;
            clean-purge-cache) args+=("--clean" "--purge-cache") ;;
            *) echo "Unknown clean_tier: ${{ inputs.clean_tier }}" >&2; exit 1 ;;
          esac
          bash scripts/build.sh "${args[@]}"

      - name: Stage packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact-upload
          mkdir -p artifact-upload
          find_packages() {
            find build -type f -not -path '*/_CPack_Packages/*' \
              -name 'UltraScan3-*-Linux-*.tar.xz'
          }
          package_count=$(find_packages | wc -l | tr -d ' ')
          if [[ $package_count -ne 1 ]]; then
            printf 'Expected exactly one packaged artifact, found %d:\n' "$package_count" >&2
            find_packages >&2
            exit 1
          fi
          package=$(find_packages)
          cp "$package" artifact-upload/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name_prefix }}-${{ inputs.artifact_platform_label || 'oraclelinux8' }}
          path: artifact-upload/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
